name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.2.1

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-only: true

      - name: Verify and build
        run: bash scripts/public-ci.sh

      - name: Package Linux release
        run: bash scripts/public-release.sh "$RUNNER_TEMP/oraculum-linux-amd64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            printf 'release tag must use vYYYY.MM.DD\n' >&2
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/oraculum-linux-amd64.zip" \
            --verify-tag --generate-notes --title "Oraculum $tag"
